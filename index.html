<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odin Admin Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo">
      <div class="sidebar-item">
        <img src="icons/view-dashboard.svg" alt="로고 아이콘" width="50px">
        <span>Dashboard</span>
      </div>
    </div>

    <div class="nav">
      <div class="sidebar-item">
        <img src="icons/home.svg" alt="nav home 메뉴 아이콘" width="50px">
        <span>Home</span>
      </div>
      <div class="sidebar-item">
        <img src="icons/card-account-details.svg" alt="nav profile 메뉴 아이콘" width="50px">
        <span>Profile</span>
      </div>
      <div class="sidebar-item">
        <img src="icons/message-reply.svg" alt="nav messages 메뉴 아이콘" width="50px">
        <span>Messages</span>
      </div>
      <div class="sidebar-item">
        <img src="icons/clock-time-three.svg" alt="nav history 메뉴 아이콘" width="50px">
        <span>History</span>
      </div>
      <div class="sidebar-item">
        <img src="icons/note-multiple.svg" alt="nav Tasks 메뉴 아이콘" width="50px">
        <span>Tasks</span>
      </div>
      <div class="sidebar-item">
        <img src="icons/account-group.svg" alt="nav communities 메뉴 아이콘" width="50px">
        <span>Communities</span>
      </div>
    </div>

    <div class="branding">
      <div class="sidebar-item">
        <img src="icons/cog.svg" alt="branding settings 메뉴 아이콘" width="50px">
        <span>Settings</span>
      </div>
      <div class="sidebar-item">
        <img src="icons/help-box.svg" alt="branding support 메뉴 아이콘" width="50px">
        <span>Support</span>
      </div>
      <div class="sidebar-item">
        <img src="icons/shield-check.svg" alt="branding privacy 메뉴 아이콘" width="50px">
        <span>Privacy</span>
      </div>
    </div>
  </div>

  <div class="header">
    <form action="#" method="post" class="search">
      <button type="submit"><img src="icons/magnify.svg" alt="검색 버튼 아이콘"></button>
      <input type="text">
    </form>

    <div class="notify">
      <button>
        <img src="icons/bell-ring-outline.svg" alt="알림 아이콘">
      </button>
      <div class="small-profile-img"></div>
      <div class="username"></div>
    </div>

    <div class="user-info">
      <div class="big-profile-img"></div>
      <span class="hi-message"></span>
      <span class="user-name-id">Morgan Oakley (@morgan)</span>
    </div>

    <div class="control-buttons">
      <button class="control-button">New</button>
      <button class="control-button">Upload</button>
      <button class="control-button">Share</button>
    </div>
  </div>

  <div class="main-content">main-content</div>
</body>
</html>
